version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.3
    container_name: hiresmart-db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: hiresmart
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - hiresmart-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hiresmart-cache
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - hiresmart-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiresmart-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mongodb://admin:password@mongodb:27017/hiresmart?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      NLP_SERVICE_URL: http://nlp:5000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/logs:/app/backend/logs
    networks:
      - hiresmart-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Python NLP Service (Optional - can run separately)
  # nlp:
  #   build:
  #     context: ./ai
  #     dockerfile: Dockerfile
  #   container_name: hiresmart-nlp
  #   restart: always
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     FLASK_ENV: production
  #     OPENAI_API_KEY: ${OPENAI_API_KEY}
  #   volumes:
  #     - ./ai:/app
  #   networks:
  #     - hiresmart-network

  # Frontend (Optional - can be served separately)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: hiresmart-ui
  #   restart: always
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - api
  #   networks:
  #     - hiresmart-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  hiresmart-network:
    driver: bridge
